name: PipDog
options:
  bundleIdPrefix: com.hwj
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  PipDog:
    type: application
    platform: macOS
    sources:
      - PipDog
    info:
      path: PipDog/Resources/Info.plist
      properties:
        CFBundleDisplayName: PipDog
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.utilities
        NSScreenCaptureUsageDescription: PipDog 需要屏幕录制权限来实时显示窗口画面。
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hwj.PipDog
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: PipDog/Resources/PipDog.entitlements
      configs:
        Release:
          # Release 不注入 get-task-allow（公证要求）
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
