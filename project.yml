name: PipDog
options:
  bundleIdPrefix: com.hwj
  developmentLanguage: en
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "1"
    # 界面文字都在 String Catalog（Localizable.xcstrings、InfoPlist.xcstrings）里，英文为源语言
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
targets:
  PipDog:
    type: application
    platform: macOS
    sources:
      - PipDog
    info:
      path: PipDog/Resources/Info.plist
      properties:
        CFBundleDisplayName: PipDog
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.utilities
        NSScreenCaptureUsageDescription: "PipDog needs Screen Recording permission (called Screen & System Audio Recording on macOS 15 and later) to show live window content." # 中文在 InfoPlist.xcstrings
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hwj.PipDog
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: PipDog/Resources/PipDog.entitlements
      configs:
        Release:
          # Release 不注入 get-task-allow（公证要求）
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
